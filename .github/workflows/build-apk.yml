name: Build Sa3a We Yefsel APK
on:
  push:
    branches: [android-timer-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and extract app source
        run: |
          echo 'ca9d6e1b4cb10a3c54f0ba193751becdeb2544de99fb84174cbe375286c09d38  timer-source.tar.xz' | sha256sum -c -
          tar -xJf timer-source.tar.xz
      - name: Install Android SDK 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Debug APK
        run: cd saaweyefsel-android && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sa3aWeYefsel-APK
          path: saaweyefsel-android/app/build/outputs/apk/debug/app-debug.apk
